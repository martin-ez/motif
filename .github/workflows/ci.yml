name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # cpal's Linux backend links against ALSA, so every job that compiles
      # this crate for a Linux host needs its development headers. The aarch64
      # job is the exception: it cross-checks, and .cargo/config.toml points it
      # at a stub .pc instead.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features

  style:
    name: house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AGENTS.md rules that rustc and clippy cannot express: no inline
      # comments, no test modules under src/, no TODO markers, no prose outside
      # the code beyond a folder README, no documentation of unbuilt features.
      - run: scripts/check-style.sh

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # cpal's Linux backend links against ALSA, so every job that compiles
      # this crate for a Linux host needs its development headers. The aarch64
      # job is the exception: it cross-checks, and .cargo/config.toml points it
      # at a stub .pc instead.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Undocumented public items fail via missing_docs; broken intra-doc links
      # fail via RUSTDOCFLAGS. Doc examples are compiled and run, which is what
      # keeps documentation in the code from going quietly stale.
      - run: cargo doc --no-deps --all-features
      - run: cargo test --doc --all-features

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # cpal's Linux backend links against ALSA. The macOS runner uses
      # CoreAudio and needs nothing installed.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --all-features

  features:
    name: feature flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # cpal's Linux backend links against ALSA, so every job that compiles
      # this crate for a Linux host needs its development headers. The aarch64
      # job is the exception: it cross-checks, and .cargo/config.toml points it
      # at a stub .pc instead.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Building both ways catches a feature that only compiles when it is
      # switched on, which is the failure mode that makes flag-gated merging
      # unsafe.
      - run: cargo check --all-targets
      - run: cargo check --all-targets --no-default-features

  mutants:
    name: mutation coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # cpal's Linux backend links against ALSA, so every job that compiles
      # this crate for a Linux host needs its development headers. The aarch64
      # job is the exception: it cross-checks, and .cargo/config.toml points it
      # at a stub .pc instead.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Test-first ordering is not observable in a diff, but its purpose is:
      # tests that genuinely constrain behaviour. cargo-mutants alters the code
      # and fails when no test notices. Scoped to the diff so the runtime stays
      # proportional to the change.
      - run: |
          git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.diff
          cargo mutants --in-diff /tmp/pr.diff --no-shuffle -j 2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out

  aarch64:
    name: cross-compile guard (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The long-term target is a standalone aarch64 device. This job exists to
      # fail loudly the first time a dependency does not cross-compile, rather
      # than letting that be discovered once it is expensive to undo.
      #
      # When a dependency needs system libraries (ALSA, for instance), this
      # needs a cross sysroot — switch it to `cross` rather than deleting it.
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: cargo check --target aarch64-unknown-linux-gnu --all-features
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
