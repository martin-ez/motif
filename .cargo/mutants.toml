# Every feature is built and tested, because cargo-mutants reads the source
# rather than the cfgs: a mutant inside a feature that is off still enumerates,
# still builds, and is then reported as missed by a suite that never compiled
# it. A feature nobody mutates is a feature nobody tests.
additional_cargo_args = ["--all-features"]

# A thin shell over an API a runner cannot exercise, where a mutant is a miss no
# test could ever catch. The behaviour that is not the API's own lives elsewhere
# and is mutated normally.
exclude_globs = [
  # A shell over the library; what is worth testing is reachable from tests/.
  "src/main.rs",
  # A shell over cpal, and the runners have no audio device. The lifecycle, the
  # granted configuration and the errors sit behind AudioBackend, tested through
  # NullBackend.
  "src/audio/cpal_backend.rs",
  # A shell over libc's termios, and constraining it would mean seizing a real
  # terminal. Which cells get written is FrameWriter's, tested against a sink.
  "src/ui/terminal/screen.rs",
  # Reading and writing an affinity mask, one branch per host, of which a sweep
  # compiles one: a mutant in a branch this runner does not build is inert, so
  # it is missed by construction rather than for want of a test. Nothing that
  # decides a Grant is here — which core is reserved, what an error number
  # meant, and what is put back afterwards are in placement.rs, and mutated.
  "src/audio/placement/host.rs",
]

# Equivalent to the code it replaces rather than uncaught by it: the two compute
# the same result for every input, so no test can tell them apart. Named one
# mutation at a time, so every other mutation of the same item is still caught.
exclude_re = [
  # A tag above bit 32 and a payload below never share a bit, so `|` and `^`
  # pack the same word.
  'replace \| with \^ in Command::to_bits',
  # The last block's load above bit 32 and the recent peak below.
  'replace \| with \^ in Headroom::packed',
  # Peak above bit 32 and RMS below: disjoint halves again.
  'replace \| with \^ in Levels::packed',
  # Playhead above bit 32 and recorded length below.
  'replace \| with \^ in LoopPosition::packed',
  # The take count above bit 32 and the round trip it carries below.
  'replace \| with \^ in Measurement::packed',
  # `<=` admits only the selection sitting on the offset, where the assignment
  # it admits sets the offset to the value it already holds.
  'replace < with <= in ListPage::keep_the_selection_visible',
  # The panel has one encoder, whose discriminant is zero, so adding it to the
  # buttons' length and subtracting it land in the same slot. A second encoder
  # makes the two differ, and this line should go when one arrives.
  'replace \+ with - in Control::position',
  # `<=` admits a playhead of exactly the loop's length, which leaves no run
  # before the boundary, so the block is filled from the start either way.
  'replace < with <= in LoopBuffer::play_into',
]
