# Mutating the binary entry point reports a miss that no test could ever catch:
# main is a shell over the library, and there is nothing in it to constrain.
# Keeping it that thin is deliberate — the behaviour worth testing lives in the
# library, where tests/ can reach it as an external consumer.
#
# The cpal backend is excluded for the same reason, one layer down: it is a
# shell over cpal's API, and the runners have no audio device, so every test
# that could constrain it is #[ignore]d and cargo-mutants would report misses
# nothing could ever catch. The behaviour that is not cpal's — the lifecycle,
# the granted configuration, the errors — lives behind AudioBackend and is
# tested through NullBackend, which is mutated normally.
# The terminal screen is excluded on the same grounds, one layer further out:
# it is a shell over libc's termios calls, and a runner has no terminal, so the
# only test that could constrain it would have to seize a real one — worse than
# no test. Which cells get written is not libc's decision and not excluded: that
# lives in FrameWriter, which is mutated normally and tested against a sink that
# is not a terminal at all.
exclude_globs = [
  "src/main.rs",
  "src/audio/cpal_backend.rs",
  "src/ui/terminal/screen.rs",
]

# A command is packed into one word as a tag above bit 32 and a payload below
# it. The two fields never share a bit, so `|` and `^` compute the same word for
# every command that exists, and no test can tell them apart — the mutant is
# equivalent to the code it replaces rather than uncaught by it. Excluded by
# name so that every other mutation of the encoding still has to be caught.
#
# A level pair is packed the same way, peak above bit 32 and RMS below it, and
# is equivalent for the same reason: two disjoint halves of a word.
exclude_re = [
  'replace \| with \^ in Command::to_bits',
  'replace \| with \^ in Levels::packed',
]
