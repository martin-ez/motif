# cpal's Linux backend pulls in alsa-sys, whose build script panics unless
# pkg-config can resolve alsa for the target — which on a macOS host it cannot.
# `cargo check` never links, so pkg-config only has to succeed: a stub .pc is
# enough, and keeps the aarch64 guard in AGENTS.md a plain `cargo check` away.
#
# This validates type-checking and cfg resolution, not linking. Producing an
# actual aarch64 binary still needs a sysroot with libasound2-dev:arm64.
[env]
PKG_CONFIG_ALLOW_CROSS = "1"
PKG_CONFIG_PATH = { value = "cross/pkgconfig", relative = true }
